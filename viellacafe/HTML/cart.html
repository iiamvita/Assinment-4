<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | Viella's Café</title>

    <meta name="description"
        content="Review your selected drinks and manage your order at Viella's Café.">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/cart.css">
    <link rel="stylesheet" href="../CSS/menu.css">
</head>

<body>

    <div class="app-layout">
        <div id="header"></div>

        <main>

        <!-- Cart Banner -->
        <section class="menu-banner">
            <div>
                <h1>Your Shopping Cart</h1>

                <p class="breadcrumb">
                    <a href="index.html">Home</a> / Cart
                </p>
            </div>
        </section>


        <!-- Shopping Cart -->
        <section class="cart-section">

            <div class="cart-container">

                <h2>Your Order</h2>

                <!-- Cart Products -->
                <div id="cart-items"></div>


                <!-- Cart Total -->
                <div class="cart-total" id="cart-total">

                    <h3>
                        Total: <span id="cart-total-price">TT$0.00</span>
                    </h3>

                    <a href="checkout.html"
                        class="checkout-btn"
                        id="checkout-btn">
                        Proceed to Checkout
                    </a>

                    <p>
                        <a href="index.html">Continue Shopping</a>
                    </p>

                </div>

            </div>

        </section>

        </main>
    </div>


    <!-- Footer -->
    <div id="footer"></div>


    <!-- JavaScript -->
    <script src="../JS/menuDB.js"></script> <!-- NEW -->
    <script src="../JS/headerScroll.js"></script>


    <script>

        /* =====================================
           HEADER LOADING
        ===================================== */

        fetch("header.html")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Header could not be loaded.");
                }

                return response.text();
            })
            .then(data => {
                document.getElementById("header").innerHTML = data;
                lucide.createIcons();

                if (typeof setupHeaderScroll === "function") {
                    setupHeaderScroll();
                }

                if (typeof setupMobileMenu === "function") {
                    setupMobileMenu();
                }
            })
            .catch(error => {
                console.error("Header loading error:", error);
            });


        /* =====================================
           FOOTER LOADING
        ===================================== */

        fetch("footer.html")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Footer could not be loaded.");
                }

                return response.text();
            })
            .then(data => {
                document.getElementById("footer").innerHTML = data;
                document.getElementById("footer-year").textContent =
                    new Date().getFullYear();
            })
            .catch(error => {
                console.error("Footer loading error:", error);
            });


        /* =====================================
           CART ELEMENTS
        ===================================== */

        const cartItems = document.getElementById("cart-items");

        const cartTotal = document.getElementById("cart-total");

        const totalPrice = document.getElementById("cart-total-price");

        const checkoutButton = document.getElementById("checkout-btn");


        /* =====================================
           PRICE FORMAT
        ===================================== */

        function formatPrice(price) {

            return "TT$" + Number(price).toFixed(2);

        }


        /* =====================================
           GET CART DATA
        ===================================== */

        function getCartItems() {

            try {
                return Cart.getCart();
            }

            catch (error) {
                console.error("Could not read cart:", error);
                return [];
            }

        }


        /* =====================================
           SAVE CART DATA
        ===================================== */

        function saveCart(items) {

            localStorage.setItem(
                "viella_cart",
                JSON.stringify(items)
            );

        }

/* =====================================
   GET PRODUCT INFORMATION (STRING FIX)
===================================== */
    function getProduct(productId) {
    const products = DB.get("products") || [];
    return products.find(product => String(product.id) === String(productId));
}


        /* =====================================
           RENDER CART
        ===================================== */

        function renderCart() {

            cartItems.innerHTML = "";

            let cart = getCartItems();

            let total = 0;


            /* ---------- EMPTY CART ---------- */

            if (cart.length === 0) {

                cartItems.innerHTML = `
                    <div class="empty-cart">
                        <h3>Your cart is empty!</h3>

                        <p>
                            Looks like you haven't added
                            anything to your cart yet.
                        </p>

                        <a href="index.html">
                            Explore Our Menu
                        </a>
                    </div>
                `;

                cartTotal.style.display = "none";

                return;
            }


            cartTotal.style.display = "block";


            /* ---------- DISPLAY CART ITEMS ---------- */

            cart.forEach((item, index) => {

                const product = getProduct(item.id);

                if (!product) {
                    console.error(
                        "Product not found:",
                        item.id
                    );
                    return;
                }


                const price = Number(
                    product.prices[item.size]
                );


                const quantity = Math.max(
                    1,
                    Number(item.quantity) || 1
                );


                if (!Number.isFinite(price)) {
                    console.error(
                        "Invalid product price:",
                        product.name
                    );
                    return;
                }


                const itemTotal = price * quantity;

                total += itemTotal;


                /* ---------- CREATE CART ITEM ---------- */

                const cartItem = document.createElement("div");

                cartItem.className = "cart-item";


                /* Product Image */

                const image = document.createElement("img");

                image.className = "cart-item-image";

                image.src = "../images/" + product.image;

                image.alt = product.name;

                image.style.width = "85px";
                image.style.height = "85px";
                image.style.objectFit = "contain";
                image.style.borderRadius = "7px";

                image.onerror = function () {

                    this.onerror = null;

                    this.src =
                        "../images/viella-cafe-logo.png";

                };


                /* Product Information */

                const info = document.createElement("div");

                info.className = "cart-item-info";


                const name = document.createElement("h3");

                name.textContent = product.name;


                const size = document.createElement("p");

                const sizeNames = {
                    S: "Small",
                    M: "Medium",
                    L: "Large"
                };

                size.textContent =
                    "Size: " + (sizeNames[item.size] || item.size);


                const priceText = document.createElement("p");

                priceText.textContent =
                    "Price: " + formatPrice(price);


                const itemTotalText = document.createElement("p");

                itemTotalText.textContent =
                    "Subtotal: " + formatPrice(itemTotal);


                info.appendChild(name);

                info.appendChild(size);

                info.appendChild(priceText);

                info.appendChild(itemTotalText);


                /* ---------- QUANTITY CONTROLS ---------- */

                const quantityControls =
                    document.createElement("div");

                quantityControls.className = "quantity-controls";


                const decrease = document.createElement("button");

                decrease.type = "button";

                decrease.textContent = "-";

                decrease.setAttribute(
                    "aria-label",
                    "Decrease quantity"
                );


                const quantityDisplay =
                    document.createElement("span");

                quantityDisplay.textContent = quantity;


                const increase = document.createElement("button");

                increase.type = "button";

                increase.textContent = "+";

                increase.setAttribute(
                    "aria-label",
                    "Increase quantity"
                );


                /* Decrease Quantity */

                decrease.addEventListener("click", () => {

                    const updatedCart = getCartItems();

                    if (updatedCart[index].quantity > 1) {

                        updatedCart[index].quantity--;

                    } else {

                        updatedCart.splice(index, 1);

                    }

                    saveCart(updatedCart);

                    renderCart();

                });


                /* Increase Quantity */

                increase.addEventListener("click", () => {

                    const updatedCart = getCartItems();

                    updatedCart[index].quantity++;

                    saveCart(updatedCart);

                    renderCart();

                });


                quantityControls.appendChild(decrease);

                quantityControls.appendChild(quantityDisplay);

                quantityControls.appendChild(increase);


                /* ---------- REMOVE BUTTON ---------- */

                const removeButton =
                    document.createElement("button");

                removeButton.type = "button";

                removeButton.className = "remove-btn";

                removeButton.textContent = "Remove";


                removeButton.addEventListener("click", () => {

                    const updatedCart = getCartItems();

                    updatedCart.splice(index, 1);

                    saveCart(updatedCart);

                    renderCart();

                });


                /* ---------- ASSEMBLE CART ITEM ---------- */

                cartItem.appendChild(image);

                cartItem.appendChild(info);

                cartItem.appendChild(quantityControls);

                cartItem.appendChild(removeButton);


                cartItems.appendChild(cartItem);

            });


            /* ---------- UPDATE TOTAL ---------- */

            totalPrice.textContent = formatPrice(total);


            /* Disable checkout if no valid items remain */

            checkoutButton.style.display =
                total > 0 ? "inline-block" : "none";

        }


        /* =====================================
           INITIALIZE CART
        ===================================== */

        if (
            typeof DB !== "undefined" &&
            typeof Cart !== "undefined"
        ) {

            renderCart();

        } else {

            cartItems.textContent =
                "Unable to load your cart. Please check db.js.";

            cartTotal.style.display = "none";

            console.error(
                "DB or Cart is not available."
            );

        }

    </script>

</body>

</html>
